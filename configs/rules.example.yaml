# 路由规则配置文件
# 此文件可以单独配置路由规则，并在主配置文件中引用

# GeoIP数据库文件路径（可选）
# 下载地址: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb
geoip_database: "data/GeoLite2-Country.mmdb"

# 路由规则列表（按顺序匹配）
rules:
  # ==================== 直连规则 ====================
  # 国内常见网站直连
  - type: DOMAIN-SUFFIX
    pattern: "baidu.com"
    action: DIRECT
    
  - type: DOMAIN-SUFFIX
    pattern: "taobao.com"
    action: DIRECT
    
  - type: DOMAIN-SUFFIX
    pattern: "qq.com"
    action: DIRECT
    
  - type: DOMAIN-SUFFIX
    pattern: "jd.com"
    action: DIRECT
    
  - type: DOMAIN-SUFFIX
    pattern: "alipay.com"
    action: DIRECT
    
  - type: DOMAIN-SUFFIX
    pattern: "tmall.com"
    action: DIRECT
    
  - type: DOMAIN-SUFFIX
    pattern: "163.com"
    action: DIRECT
    
  - type: DOMAIN-SUFFIX
    pattern: "sina.com.cn"
    action: DIRECT
    
  - type: DOMAIN-SUFFIX
    pattern: "weibo.com"
    action: DIRECT
    
  # ==================== 代理规则 ====================
  # 国外常见网站代理
  - type: DOMAIN-SUFFIX
    pattern: "google.com"
    action: PROXY
    
  - type: DOMAIN-SUFFIX
    pattern: "youtube.com"
    action: PROXY
    
  - type: DOMAIN-SUFFIX
    pattern: "twitter.com"
    action: PROXY
    
  - type: DOMAIN-SUFFIX
    pattern: "facebook.com"
    action: PROXY
    
  - type: DOMAIN-SUFFIX
    pattern: "instagram.com"
    action: PROXY
    
  - type: DOMAIN-SUFFIX
    pattern: "github.com"
    action: PROXY
    
  - type: DOMAIN-SUFFIX
    pattern: "openai.com"
    action: PROXY
    
  # ==================== IP规则 ====================
  # 局域网IP直连
  - type: IP-CIDR
    pattern: "192.168.0.0/16"
    action: DIRECT
    
  - type: IP-CIDR
    pattern: "10.0.0.0/8"
    action: DIRECT
    
  - type: IP-CIDR
    pattern: "172.16.0.0/12"
    action: DIRECT
    
  - type: IP-CIDR
    pattern: "127.0.0.0/8"
    action: DIRECT
    
  # ==================== GeoIP规则 ====================
  # 中国IP直连（需要geoip_database）
  - type: GEOIP
    pattern: "CN"
    action: DIRECT
    
  # ==================== 拒绝规则 ====================
  # 广告域名拒绝（示例）
  # - type: DOMAIN-SUFFIX
  #   pattern: "ad.doubleclick.net"
  #   action: REJECT
  #   
  # - type: DOMAIN-SUFFIX
  #   pattern: "googleads.g.doubleclick.net"
  #   action: REJECT
    
  # ==================== 默认规则 ====================
  # 默认规则：其他所有流量走代理（必须是最后一条）
  - type: FINAL
    action: PROXY
